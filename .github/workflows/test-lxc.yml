name: Validate PVE LXC X-Tunnel

on:
  push:
    branches: [lxc]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lxc-compatible:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check script syntax and dependencies
        run: |
          for script in install.sh menu.sh quick-install.sh uninstall.sh systemd/ownership.sh tests/test_lxc_uninstall.sh; do
            sh -n "$script"
          done
          python3 -m pip install PyYAML
          python3 -m compileall -q cfip_speedtest.py supervisor.py sync_singbox.py migrate_config.py telegram_speedtest_bot.py project_settings.py systemd tests
      - name: Test CF direct routes, isolated UID, unified YAML and systemd timer
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test complete uninstall against mock-only systemd tree
        run: sh tests/test_lxc_uninstall.sh
