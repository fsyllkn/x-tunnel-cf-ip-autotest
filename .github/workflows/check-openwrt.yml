name: Validate OpenWrt manager

on:
  push:
    branches: [openwrt]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check BusyBox-compatible shell syntax
        run: |
          sh -n install.sh
          sh -n menu.sh
          sh -n quick-install.sh
          sh -n openwrt/run-speedtest.sh
          sh -n openwrt/speedtest-timer.sh
          sh -n tests/test_speedtest_timer.sh
      - name: Verify HH:MM cron management without modifying system cron
        run: sh tests/test_speedtest_timer.sh
      - name: Check Python modules and export regression tests
        run: |
          python3 -m pip install PyYAML
          python3 -m compileall -q cfip_speedtest.py supervisor.py sync_singbox.py openwrt tests
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Ensure a non-listening candidate fails preflight
        run: |
          if python3 openwrt/kernel_smoke.py /bin/true; then
            echo 'BUG: preflight accepted a candidate without a SOCKS5 listener' >&2
            exit 1
          fi
      - name: Positive preflight against byte-identical stable Go core
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output /tmp/x-tunnel-linux-amd64 \
            https://github.com/fsyllkn/x-tunnel/releases/download/openwrt-stable-go126-v1/x-tunnel-linux-amd64
          printf '%s  %s\n' \
            'ae3a79a4d2a6a8d7e1377afb2e022c5ed75b0157a694fb6aead9d86ab873ccc2' \
            '/tmp/x-tunnel-linux-amd64' | sha256sum --check
          chmod 755 /tmp/x-tunnel-linux-amd64
          python3 openwrt/kernel_smoke.py /tmp/x-tunnel-linux-amd64
