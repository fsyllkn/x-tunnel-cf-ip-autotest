# X-Tunnel 统一配置（唯一需要编辑的配置文件：x-tunnel.yaml）。
# 复制为 x-tunnel.yaml；chmod 600 x-tunnel.yaml，包含节点密钥与可选 Telegram Token。
# 节点行: 名称|服务地址|token|cfip|连接数|端口；留空的字段使用 defaults。
defaults:
  token: "替换为你的默认密钥"
  cfip: "替换为优选 CF IP"
  connections: 3
  ech: "cloudflare-ech.com"
  dns: "https://doh.pub/dns-query"
  # 唯一的 SOCKS5 监听配置，不再被 project.env 中空变量覆盖。
  # 如需局域网 SOCKS5，增加本设备的 LAN IP，并限制 LAN 防火墙允许的客户端。
  listen_hosts:
    - "127.0.0.1"
    # - "192.168.68.11"
  first_port: 32322

max_nodes: 5
nodes:
  - "节点1|wss://example.com/path:443||||"
  - "节点2|wss://example.com/path:443||||"

# 原 project.env 的变量全部移到这里。变更后 supervisor 会自动感知 YAML。
settings:
  provider_path: "runtime/x-tunnel-provider.json"
  process_uid: 29002
  # shellcrash:7890 组存在时可选主 GID 7890，否则回退为专用 UID 的 GID。
  # uid 强制无 ShellCrash 兼容；7890 需要精确匹配真实 shellcrash 组。
  process_gid: auto
  local_proxy: "http://127.0.0.1:7890"
  telegram_proxy: ""
  target_mbps: 300

# 原 speedtest-bot.env 的变量。Bot 可选；留空时不发送 Telegram 通知。
# 请勿上传包含真实 Telegram Token 的 x-tunnel.yaml。
telegram:
  token: ""
  chat_id: ""
